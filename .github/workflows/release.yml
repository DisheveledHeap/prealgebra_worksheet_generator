name: Build and Release

on:
  push:
    tags:
      - "v*.*"   # e.g. v1.0.0
  release:
    types: [created]   # run on release creation

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Bundle assets
        shell: bash
        run: |
          mkdir dist
          cp -r assets dist/assets
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp target/release/${{ github.event.repository.name }}.exe dist/
          else
            cp target/release/${{ github.event.repository.name }} dist/
          fi

      - name: Create archive
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a ${{ github.event.repository.name }}-${{ runner.os }}.zip ./dist/*
          else
            tar czf ${{ github.event.repository.name }}-${{ runner.os }}.tar.gz -C dist .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ runner.os }}
          path: ${{ github.event.repository.name }}-${{ runner.os }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-Linux
      - uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-Windows
      - uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-macOS
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            *.tar.gz
